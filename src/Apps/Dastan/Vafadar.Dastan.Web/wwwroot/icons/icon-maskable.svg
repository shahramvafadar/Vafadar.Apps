<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dastan">
  <!-- Provisional icon for platforms that cut their own shape out of it: the same drawing as icon.svg on a full
       square, kept inside the middle of the square so that no shape cuts into it. -->
