# The services Dastan uses on a development machine. Everything belongs to one Compose project named "test"
# (decision D-034); nothing here is started in production and nothing of another project is touched.
#
#   docker compose -f src/Apps/Dastan/compose.yaml up -d      start
#   docker compose -f src/Apps/Dastan/compose.yaml down       stop and remove
name: test

services:
  # The PostgreSQL of development and of the tests (step 19.3, ADR 0015). It keeps nothing: its data lies in
  # memory and is gone when the container stops; every test makes a database of its own in it. It answers this
  # machine only and asks for no password – never run a database that keeps something this way. The image is the
  # one the repository pins for its other PostgreSQL.
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
    tmpfs:
      - /var/lib/postgresql
    mem_limit: 3g
    ports:
      - "127.0.0.1:53432:5432"

  # The browser of the browser tests (decision 11 of the delivery plan): the official Playwright image, run as a
  # server the tests connect to. Its version is the version of the Microsoft.Playwright package in
  # Directory.Packages.props; a client and a server of different versions refuse each other.
  # What catches the mail of a development machine and of the tests (ADR 0016): it takes every message by SMTP,
  # sends none of them on, and shows them at http://127.0.0.1:53480. It keeps nothing when it is removed.
  mail:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    environment:
      MP_MAX_MESSAGES: "2000"
      # It asks nobody outside whether a newer version of it exists.
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      # Reachable from this machine only: SMTP, and the page with its API.
      - "127.0.0.1:53425:1025"
      - "127.0.0.1:53480:8025"
    mem_limit: 256m

  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    init: true
    ipc: host
    user: pwuser
    # A browser that takes more than this is stopped by itself; without a limit it can take the memory of every
    # other container of this machine with it. Three engines at work stay well below it.
    mem_limit: 6g
    working_dir: /home/pwuser
    command: ["/bin/sh", "-c", "npx -y playwright@1.64.1 run-server --port 3000 --host 0.0.0.0"]
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:53333:3000"
