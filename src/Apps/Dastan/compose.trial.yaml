# The Dastan website with accounts, as it runs for a closed trial (docs/operations.md, D-067, D-068): the image of
# the Dockerfile, a folder of content mounted read-only, and one volume for everything the site keeps – the store
# of the visitors, their photographs, the keys of the forms. It belongs to the Compose project "test" like the
# other services of Dastan (decision D-034).
#
#   $env:DASTAN_CONTENT = "<the content folder to show>"
#   docker compose -f src/Apps/Dastan/compose.trial.yaml up -d --build     build and start: http://127.0.0.1:53382
#   docker compose -f src/Apps/Dastan/compose.trial.yaml down              stop and remove; the volume stays
#
# Make the first account, then start again with $env:DASTAN_INVITATION_ONLY = "true": from then on a new account
# needs an invitation of somebody who has one.
name: test

services:
  trial:
    build:
      context: ../../..
      dockerfile: src/Apps/Dastan/Dockerfile
    image: dastan-site:local
    read_only: true
    tmpfs:
      - /tmp
    # Enough for the site and for one large photograph that is read whole to make its smaller size
    # (ImageSizes.MostPixels: fifty million pixels, four bytes each, twice while it is turned upright).
    mem_limit: 1g
    environment:
      Dastan__Sample: ${DASTAN_SAMPLE:-shahnameh-pilot.json}
      # Public (the default) shows a published revision. A trial with content that is not published yet names
      # LocalDemonstration – never on a site everybody can reach.
      Dastan__Audience: ${DASTAN_AUDIENCE:-Public}
      # The database of the site (ADR 0015): the PostgreSQL below. Its password is set in the environment of
      # this machine (DASTAN_DB_PASSWORD) by who runs the trial and is never written into a file.
      Dastan__Database: Host=database;Database=dastan;Username=dastan;Password=${DASTAN_DB_PASSWORD:?set a password for the database in DASTAN_DB_PASSWORD}
      Dastan__Photos: /data/photos
      Dastan__Keys: /data/keys
      # What visitors report about a statement (ADR 0012), kept in the database; the editors read it with their tool.
      Dastan__Reports: "true"
      # Legal texts of the owner's own, in the place of the ones of the program: a folder of plain files on the
      # volume, for example /data/legal. Not set, the site shows its own texts.
      Dastan__Legal: ${DASTAN_LEGAL:-}
      # Who runs the site, for the imprint, the privacy notice and the terms (docs/legal/before-publication.md).
      # Said in the environment of this machine, never in a file of the repository: an address is private.
      Dastan__Operator__Street: ${DASTAN_OPERATOR_STREET:-}
      Dastan__Operator__Town: ${DASTAN_OPERATOR_TOWN:-}
      Dastan__Operator__Country: ${DASTAN_OPERATOR_COUNTRY:-}
      Dastan__Operator__Phone: ${DASTAN_OPERATOR_PHONE:-}
      Dastan__Operator__Host: ${DASTAN_OPERATOR_HOST:-}
      Dastan__Operator__Network: ${DASTAN_OPERATOR_NETWORK:-}
      Dastan__Operator__Authority: ${DASTAN_OPERATOR_AUTHORITY:-}
      # Notices about content (Article 16 of the Digital Services Act), kept in the database; read with the command "notices".
      Dastan__Notices: "true"
      # What the operator has to tell everybody, on every page, until it is taken out again.
      Dastan__Announcement: ${DASTAN_ANNOUNCEMENT:-}
      Dastan__InvitationOnly: ${DASTAN_INVITATION_ONLY:-false}
      # Who the site believes about how a visitor came: the networks Docker gives its containers. A tunnel or a
      # proxy in front of the site is named here by whoever sets it up.
      # Narrower is better: the address of the proxy alone, where it is known (DASTAN_TRUSTED_PROXY).
      Dastan__TrustedProxies__0: ${DASTAN_TRUSTED_PROXY:-172.16.0.0/12}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ${DASTAN_CONTENT:?name the folder of content in DASTAN_CONTENT}:/app/content:ro
      - dastan-trial-data:/data
    ports:
      # Reachable from this machine only; a tunnel reaches it from here.
      - "127.0.0.1:53382:8080"

  # The way from outside to the trial (D-067): a tunnel of Cloudflare, started only when it is asked for –
  #
  #   docker compose -f src/Apps/Dastan/compose.trial.yaml --profile tunnel up -d
  #
  # The owner makes the tunnel in their own Cloudflare account, points it at http://trial:8080, and enters its
  # token into the environment of this machine (CLOUDFLARE_TUNNEL_TOKEN) – never into a file of the repository.
  # Not tried: it needs that account.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Not required here: a file that demanded the token would not start the trial without a tunnel either.
      # Without a token the tunnel itself says so and stops.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - trial
    mem_limit: 256m

  # The database of the trial. It answers the site only – no port of this machine leads to it. Before the
  # site is started for the first time, and before a new version of it, its tables are made or brought up:
  #
  #   docker compose -f src/Apps/Dastan/compose.trial.yaml run --rm --entrypoint sh trial \
  #     -c 'DASTAN_DATABASE="$Dastan__Database" dotnet /command/Vafadar.Dastan.Content.dll database migrate --database env'
  #
  # (operations.md says where the command lies and how the connection is told).
  database:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: dastan
      POSTGRES_USER: dastan
      POSTGRES_PASSWORD: ${DASTAN_DB_PASSWORD:?set a password for the database in DASTAN_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dastan -d dastan"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dastan-trial-database:/var/lib/postgresql
    mem_limit: 1g

volumes:
  # What the site keeps as files: photographs, keys, notices. Back it up together with the database: the
  # photographs without the database are of no use.
  dastan-trial-data:
  # The database of the trial.
  dastan-trial-database:
