name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iOS targets (macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Libraries and tests
    runs-on: ubuntu-latest
    env:
      # Lets Vafadar.SyncfusionLicense.Tests check the key against the package version (skipped when empty).
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Vafadar.Tests.slnf contains every project except the MAUI ones, so no workloads are needed here.
      - name: Restore
        run: dotnet restore Vafadar.Tests.slnf

      - name: Build
        run: dotnet build Vafadar.Tests.slnf --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution Vafadar.Tests.slnf --configuration Release --no-build
          --report-trx --coverage --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android build
    runs-on: ubuntu-latest
    env:
      # Build-time secret, see docs/guides/secrets-and-configuration.md. Empty for pull requests from forks.
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Reuse unchanged qualified native outputs; entry hashes are checked before restore.
      - name: Cache source-built Android cipher
        uses: actions/cache@v4
        with:
          path: |
            artifacts/native-sqlcipher/build/application-android/candidate
          key: android-cipher-${{ hashFiles('eng/native/sqlcipher/inputs.lock.json', 'eng/native/sqlcipher/android.inputs.lock.json', 'eng/native/sqlcipher/NativeBuildInputs.psm1', 'eng/native/sqlcipher/Build-Android.ps1', 'eng/native/sqlcipher/Linux/**') }}

      - name: Prepare reviewed Android native dependency
        shell: pwsh
        run: ./eng/native/sqlcipher/Ensure-AndroidPackage.ps1

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/Apps/Zanance/Vafadar.Zanance.App/Vafadar.Zanance.App.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:VafadarMauiTargetFrameworks=net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # Builds every project; MAUI projects only for Android (see docs/guides/building.md).
      - name: Build (Release)
        run: dotnet build Vafadar.Apps.slnx --configuration Release -p:VafadarMauiTargetFrameworks=net10.0-android

  windows:
    name: Windows build
    runs-on: windows-2025-vs2026
    env:
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
      # Optional OAuth clients (D-35, D-50): with them the build offers OneDrive and Google Drive; empty in forks.
      MicrosoftEntraClientId: ${{ secrets.MICROSOFT_ENTRA_CLIENT_ID }}
      GoogleOAuthClientIdWindows: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_WINDOWS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Android privacy policy regressions
        run: ./eng/tests/AndroidPrivacy.Tests.ps1

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Review Windows native toolchain
        shell: pwsh
        run: ./eng/native/sqlcipher/Test-WindowsToolchain.ps1

      - name: Cache reviewed Windows source-built dependency
        uses: actions/cache@v4
        with:
          path: |
            artifacts/native-sqlcipher/build/application-windows/candidate
            artifacts/native-sqlcipher/build/application-windows/compatibility-proof.json
          key: windows-cipher-${{ hashFiles('eng/native/sqlcipher/inputs.lock.json', 'eng/native/sqlcipher/windows.crypto.profile.json', 'eng/native/sqlcipher/windows.compiler.acceptance.json', 'eng/native/sqlcipher/Build-Windows.ps1', 'eng/native/sqlcipher/WindowsToolchain.psm1', 'eng/native/sqlcipher/Windows/**') }}

      - name: Prepare reviewed Windows native dependency
        shell: pwsh
        run: ./eng/native/sqlcipher/Ensure-WindowsPackage.ps1

      - name: Build (Release)
        run: dotnet build Vafadar.Apps.slnx --configuration Release -p:VafadarMauiTargetFrameworks=net10.0-windows10.0.19041.0

  ios:
    name: iOS build (simulator)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    env:
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
      # Optional OAuth clients (D-35, D-50); they also decide the sign-in URL schemes in Info.plist.
      MicrosoftEntraClientId: ${{ secrets.MICROSOFT_ENTRA_CLIENT_ID }}
      GoogleOAuthClientIdIos: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_IOS }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # A simulator build needs no signing certificate.
      - name: Build (Debug, simulator)
        run: >
          dotnet build Vafadar.Apps.slnx --configuration Debug
          -p:VafadarMauiTargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
