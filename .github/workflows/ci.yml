name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iOS targets (macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Libraries and tests
    runs-on: ubuntu-latest
    env:
      # Lets Vafadar.SyncfusionLicense.Tests check the key against the package version (skipped when empty).
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Vafadar.Tests.slnf contains every project except the MAUI ones, so no workloads are needed here.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify Android bundle manifest permission guards
        run: python eng/maui/test_verify_android_bundle_manifest.py

      - name: Verify Android ELF alignment guards
        run: python eng/maui/test_verify_android_elf_alignment.py

      - name: Verify pinned notification source guards
        run: python eng/notifications/test_source_preparation.py

      - name: Restore
        run: dotnet restore Vafadar.Tests.slnf

      - name: Build
        run: dotnet build Vafadar.Tests.slnf --configuration Release --no-restore

      # The tests of Dastan that keep something need a PostgreSQL (its ADR 0015). The same pinned image as its
      # compose file; the data lies in memory, the port answers this runner only, and nothing but tests uses it.
      - name: Start the PostgreSQL of Dastan's tests
        run: |
          docker run -d --name dastan-test-postgres -p 127.0.0.1:53432:5432 --tmpfs /var/lib/postgresql             -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C"             postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873             postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
          for attempt in $(seq 1 30); do
            if docker exec dastan-test-postgres pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec dastan-test-postgres pg_isready -h 127.0.0.1 -U postgres

      # The tests of Dastan that send mail send it to a catcher (its ADR 0016): the same pinned image as its
      # compose file. It takes every message, sends none on, asks nobody outside, and answers this runner only.
      - name: Start the mail catcher of Dastan's tests
        run: |
          docker run -d --name dastan-test-mail -p 127.0.0.1:53425:1025 -p 127.0.0.1:53480:8025 -e MP_DISABLE_VERSION_CHECK=true -e MP_MAX_MESSAGES=2000 axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:53480/api/v1/info > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:53480/api/v1/info > /dev/null

      - name: Test
        env:
          # A missing database fails the run instead of skipping the tests that need it.
          DASTAN_POSTGRES_REQUIRED: '1'
        run: >
          dotnet test --solution Vafadar.Tests.slnf --configuration Release --no-build
          --report-trx --coverage --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android build
    runs-on: ubuntu-latest
    env:
      # Build-time secret, see docs/guides/secrets-and-configuration.md. Empty for pull requests from forks.
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Reuse unchanged qualified native outputs; entry hashes are checked before restore.
      - name: Cache source-built Android cipher
        uses: actions/cache@v6
        with:
          path: |
            artifacts/native-sqlcipher/build/application-android/candidate
          key: android-cipher-${{ hashFiles('eng/native/sqlcipher/inputs.lock.json', 'eng/native/sqlcipher/android.inputs.lock.json', 'eng/native/sqlcipher/NativeBuildInputs.psm1', 'eng/native/sqlcipher/Build-Android.ps1', 'eng/native/sqlcipher/Linux/**') }}

      - name: Prepare reviewed Android native dependency
        shell: pwsh
        run: ./eng/native/sqlcipher/Ensure-AndroidPackage.ps1

      - name: Install Android SDK dependencies
        run: >
          dotnet build eng/maui/AndroidDependencies.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # Cache only immutable public archives. Every fresh runner qualifies its own source/package output.
      - name: Cache reviewed Android Core inputs
        uses: actions/cache@v6
        with:
          path: |
            artifacts/maui-core/inputs/*.zip
            artifacts/maui-core/inputs/*.tar.gz
          key: maui-core-inputs-${{ runner.os }}-${{ hashFiles('eng/maui/configuration-metrics.inputs.json') }}

      - name: Prepare reviewed Android Core source package
        shell: pwsh
        run: ./eng/maui/Ensure-ConfigurationMetrics.ps1

      # Builds every project; MAUI projects only for Android (see docs/guides/building.md).
      - name: Build (Release)
        run: dotnet build Vafadar.Apps.slnx --configuration Release -p:VafadarMauiTargetFrameworks=net10.0-android

      # Compile the selected native store adapter and Debug boundaries as well as the default edition.
      - name: Build selected Android billing sandbox
        run: >
          dotnet build src/Apps/Zanance/Vafadar.Zanance.App/Vafadar.Zanance.App.csproj
          --configuration Debug -f net10.0-android -p:VafadarMauiTargetFrameworks=net10.0-android
          -p:ZananceBillingEnabled=true -p:ZananceBillingSandbox=true -p:ContinuousIntegrationBuild=true

  windows:
    name: Windows build
    runs-on: windows-2025-vs2026
    env:
      VafadarWindowsCipherVariant: servicing
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
      # Optional OAuth clients (D-35, D-50): with them the build offers OneDrive and Google Drive; empty in forks.
      MicrosoftEntraClientId: ${{ secrets.MICROSOFT_ENTRA_CLIENT_ID }}
      GoogleOAuthClientIdWindows: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_WINDOWS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Android privacy policy regressions
        run: ./eng/tests/AndroidPrivacy.Tests.ps1

      - name: Android APK handoff regressions
        run: ./eng/tests/AndroidApkHandoff.Tests.ps1

      - name: Android compression cache regressions
        run: ./eng/tests/AndroidCompression.Tests.ps1

      - name: Android manifest overlay regressions
        run: ./eng/tests/AndroidManifestOverlays.Tests.ps1

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Review Windows native toolchain
        shell: pwsh
        run: |
          trap { Write-Host ('::error title=Windows native toolchain::' + ($_.Exception.Message -replace "`r?`n",' ')); break }
          ./eng/native/sqlcipher/Observe-WindowsToolchain.ps1
          ./eng/native/sqlcipher/Select-HostedWindowsProducer.ps1 -EnvironmentFile $env:GITHUB_ENV
          ./eng/native/sqlcipher/Test-WindowsToolchain.ps1

      # Cache only exact immutable package entries. Candidate-only caches lose the producer
      # logs/source required by the diagnostic gate; never treat those fragments as a build.
      - name: Cache reviewed Windows source-built package
        uses: actions/cache@v6
        with:
          path: |
            artifacts/native-sqlcipher/feed/Vafadar.Native.SqlCipher.Windows.*.nupkg
          key: windows-cipher-package-${{ env.VafadarWindowsCipherVariant }}-${{ hashFiles('eng/native/sqlcipher/inputs.lock.json', 'eng/native/sqlcipher/windows.crypto.profile.json', 'eng/native/sqlcipher/windows.compiler.acceptance.json', 'eng/native/sqlcipher/windows.*package.contents.json', 'eng/native/sqlcipher/Build-Windows.ps1', 'eng/native/sqlcipher/Pack-Windows.ps1', 'eng/native/sqlcipher/NativeBuildInputs.psm1', 'eng/native/sqlcipher/Select-HostedWindowsProducer.ps1', 'eng/native/sqlcipher/WindowsToolchain.psm1', 'eng/native/sqlcipher/WindowsWarnings.psm1', 'eng/native/sqlcipher/Test-WindowsWarnings.ps1', 'eng/native/sqlcipher/windows.warnings*.json', 'eng/native/sqlcipher/Windows/**') }}

      - name: Prepare reviewed Windows native dependency
        shell: pwsh
        run: |
          trap { Write-Host ('::error title=Windows native dependency::' + ($_.Exception.Message -replace "`r?`n",' ')); break }
          ./eng/native/sqlcipher/Ensure-WindowsPackage.ps1

      - name: Verify native portable snapshot budgets
        run: >
          dotnet run --project eng/tests/SqlCipherPortableBounds --configuration Release
          -p:ContinuousIntegrationBuild=true -- artifacts/portable-snapshot-budget-results

      - name: Build (Release)
        run: dotnet build Vafadar.Apps.slnx --configuration Release -p:VafadarMauiTargetFrameworks=net10.0-windows10.0.19041.0

  ios:
    name: iOS build (simulator)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    env:
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
      # Optional OAuth clients (D-35, D-50); they also decide the sign-in URL schemes in Info.plist.
      MicrosoftEntraClientId: ${{ secrets.MICROSOFT_ENTRA_CLIENT_ID }}
      GoogleOAuthClientIdIos: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_IOS }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # A simulator build needs no signing certificate.
      - name: Build (Debug, simulator)
        run: >
          dotnet build Vafadar.Apps.slnx --configuration Debug
          -p:VafadarMauiTargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
