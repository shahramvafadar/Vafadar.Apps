name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iOS targets (macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Libraries and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Vafadar.Tests.slnf contains every project except the MAUI ones, so no workloads are needed here.
      - name: Restore
        run: dotnet restore Vafadar.Tests.slnf

      - name: Build
        run: dotnet build Vafadar.Tests.slnf --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution Vafadar.Tests.slnf --configuration Release --no-build
          --report-trx --coverage --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android build
    runs-on: ubuntu-latest
    env:
      # Build-time secret, see docs/guides/secrets-and-configuration.md. Empty for pull requests from forks.
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/Apps/Finance/Vafadar.Finance.App/Vafadar.Finance.App.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:VafadarMauiTargetFrameworks=net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # Builds every project; MAUI projects only for Android (see docs/guides/building.md).
      - name: Build (Release)
        run: dotnet build Vafadar.Apps.slnx --configuration Release -p:VafadarMauiTargetFrameworks=net10.0-android

  windows:
    name: Windows build
    runs-on: windows-latest
    env:
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build (Release)
        run: dotnet build Vafadar.Apps.slnx --configuration Release -p:VafadarMauiTargetFrameworks=net10.0-windows10.0.19041.0

  ios:
    name: iOS build (simulator)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    env:
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # A simulator build needs no signing certificate.
      - name: Build (Debug, simulator)
        run: >
          dotnet build Vafadar.Apps.slnx --configuration Debug
          -p:VafadarMauiTargetFrameworks=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
