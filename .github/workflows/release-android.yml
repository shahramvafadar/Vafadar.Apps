name: Release (Android)

# Builds a signed Android App Bundle (.aab) for upload to Google Play.
# Requires the secrets listed in docs/guides/release-and-publishing.md, stored in the "production" environment.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App project
        type: choice
        options:
          - src/Apps/Zanance/Vafadar.Zanance.App/Vafadar.Zanance.App.csproj
      version:
        description: Display version, e.g. 1.2.0
        required: true
      build-number:
        description: Store build number (Android versionCode), higher than the last upload
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  bundle:
    name: Signed App Bundle
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_PROJECT: ${{ inputs.app }}
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build-number }}
      SyncfusionLicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
      # Optional (D-35): with these OAuth clients the build offers cloud backup and keeps INTERNET; without them it stays offline.
      MicrosoftEntraClientId: ${{ secrets.MICROSOFT_ENTRA_CLIENT_ID }}
      GoogleOAuthClientIdAndroid: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_ANDROID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.0"; exit 1; }
          [[ "$APP_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::build-number must be a positive integer"; exit 1; }
          if (( ${#APP_BUILD_NUMBER} > 10 )) || (( APP_BUILD_NUMBER > 2100000000 )); then
            echo "::error::build-number exceeds the Google Play versionCode limit"
            exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD SyncfusionLicenseKey; do
            [[ -n "${!name}" ]] || { echo "::error::secret $name is missing"; exit 1; }
          done

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      # An outdated or wrong license key (e.g. after a Syncfusion major upgrade) stops the release here.
      - name: Validate Syncfusion license
        env:
          VAFADAR_REQUIRE_SYNCFUSION_LICENSE: "true"
        run: dotnet test --project test/Libraries/Vafadar.SyncfusionLicense.Tests --configuration Release

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Share the qualified producer cache with CI; validate exact package entries before restore.
      - name: Cache source-built Android cipher
        uses: actions/cache@v6
        with:
          path: |
            artifacts/native-sqlcipher/build/application-android/candidate
          key: android-cipher-${{ hashFiles('eng/native/sqlcipher/inputs.lock.json', 'eng/native/sqlcipher/android.inputs.lock.json', 'eng/native/sqlcipher/NativeBuildInputs.psm1', 'eng/native/sqlcipher/Build-Android.ps1', 'eng/native/sqlcipher/Linux/**') }}

      - name: Prepare reviewed Android native dependency
        shell: pwsh
        run: ./eng/native/sqlcipher/Ensure-AndroidPackage.ps1

      # Same as CI: the runner image may lack the Android platform the app targets.
      - name: Install Android SDK dependencies
        run: >
          dotnet build eng/maui/AndroidDependencies.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Cache reviewed Android Core inputs
        uses: actions/cache@v6
        with:
          path: |
            artifacts/maui-core/inputs/*.zip
            artifacts/maui-core/inputs/*.tar.gz
          key: maui-core-inputs-${{ runner.os }}-${{ hashFiles('eng/maui/configuration-metrics.inputs.json') }}

      - name: Prepare reviewed Android Core source package
        shell: pwsh
        run: ./eng/maui/Ensure-ConfigurationMetrics.ps1

      - name: Restore upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

      - name: Publish
        run: >
          dotnet publish "$APP_PROJECT" --configuration Release --framework net10.0-android
          -p:VafadarMauiTargetFrameworks=net10.0-android
          -p:ApplicationDisplayVersion="$APP_VERSION"
          -p:ApplicationVersion="$APP_BUILD_NUMBER"
          -p:AndroidPackageFormats=aab
          -p:ZanancePersonalSyncEnabled=false
          -p:ZananceBillingEnabled=false
          -p:ZananceBillingSandbox=false
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          --output "$RUNNER_TEMP/publish"

      - name: Verify the signed App Bundle
        id: bundle
        shell: bash
        run: |
          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/publish/*-Signed.aab)
          if (( ${#bundles[@]} != 1 )); then
            echo "::error::expected exactly one signed App Bundle"
            exit 1
          fi
          java eng/maui/VerifyAndroidBundle.java "${bundles[0]}" "$RUNNER_TEMP/upload.keystore"
          python eng/maui/verify-android-bundle-elf.py "${bundles[0]}"
          bundletool=$(dotnet msbuild "$APP_PROJECT" -nologo -v:q \
            -p:Configuration=Release -p:TargetFramework=net10.0-android \
            -p:VafadarMauiTargetFrameworks=net10.0-android \
            -t:_ResolveMonoAndroidSdks -getProperty:AndroidBundleToolJarPath)
          test -f "$bundletool" || { echo "::error::could not resolve the Android SDK bundletool"; exit 1; }
          edition=offline
          if [[ -n "$MicrosoftEntraClientId" || -n "$GoogleOAuthClientIdAndroid" ]]; then
            edition=cloud-backup
          fi
          java -jar "$bundletool" dump manifest --bundle="${bundles[0]}" | \
            python eng/maui/verify-android-bundle-manifest.py pro.vafadar.zanance "$APP_VERSION" "$APP_BUILD_NUMBER" "$edition"
          printf 'path=%s\n' "${bundles[0]}" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      # NOTE: artifacts of a public repository can be downloaded by any signed-in GitHub user.
      # Keep the retention short; upload to Google Play and delete the artifact afterwards.
      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.version }}-${{ inputs.build-number }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 3
