name: Native cipher candidates

on:
  push:
    branches: [main, 'shahram/native-producer-*']
    paths:
      - 'eng/native/sqlcipher/**'
      - 'eng/benchmarks/Zanance.ProtectedPerformance/**'
      - 'eng/benchmarks/Zanance.Performance/PerformanceFixture.cs'
      - '.github/workflows/native-cipher.yml'
  pull_request:
    paths:
      - 'eng/native/sqlcipher/**'
      - 'eng/benchmarks/Zanance.ProtectedPerformance/**'
      - 'eng/benchmarks/Zanance.Performance/PerformanceFixture.cs'
      - '.github/workflows/native-cipher.yml'
  workflow_dispatch:
    inputs:
      producer_qualification:
        description: Export qualified producer bytes before updating immutable consumer pins
        type: boolean
        required: false
        default: false
      candidate_version:
        description: New unpublished Windows candidate version for producer qualification only
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: native-cipher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows reproducibility and actual protected persistence
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      VafadarWindowsCipherVariant: servicing
      ContinuousIntegrationBuild: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Refuse immutable producer identity reuse
        shell: pwsh
        run: ./eng/native/sqlcipher/Test-ProducerVersion.ps1
      - name: Qualify exact installed Windows compiler
        shell: pwsh
        run: |
          ./eng/native/sqlcipher/Select-HostedWindowsProducer.ps1 -EnvironmentFile $env:GITHUB_ENV
          ./eng/native/sqlcipher/Test-WindowsToolchain.ps1
      # No candidate cache: this lane proves two fresh outputs, not a reused local artifact.
      - name: Build two fresh reviewed Windows candidates
        shell: pwsh
        run: |
          ./eng/native/sqlcipher/Build-Windows.ps1 -RunName windows-ci-a
          ./eng/native/sqlcipher/Build-Windows.ps1 -RunName windows-ci-b
          $first = Get-FileHash artifacts/native-sqlcipher/build/windows-ci-a/candidate/runtimes/win-x64/native/sqlcipher.dll
          $second = Get-FileHash artifacts/native-sqlcipher/build/windows-ci-b/candidate/runtimes/win-x64/native/sqlcipher.dll
          Write-Host ('Fresh Windows native SHA256: {0}; {1}' -f $first.Hash, $second.Hash)
          if ($first.Hash -ne $second.Hash) { throw 'Fresh Windows native outputs differ.' }
      - name: Verify original schema and immutable package entries
        if: ${{ !(inputs.producer_qualification || startsWith(github.ref, 'refs/heads/shahram/native-producer-')) }}
        shell: pwsh
        run: |
          ./eng/native/sqlcipher/Ensure-WindowsPackage.ps1 -RunName windows-ci-b
      - name: Qualify original schema and export unpublished producer package
        if: ${{ inputs.producer_qualification || startsWith(github.ref, 'refs/heads/shahram/native-producer-') }}
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PRODUCER_BRANCH: ${{ github.ref_name }}
        run: |
          if (-not $env:CANDIDATE_VERSION -and $env:PRODUCER_BRANCH -cmatch '^shahram/native-producer-(?<version>[0-9]+\.[0-9]+\.[0-9]+-candidate\.[1-9][0-9]*)$') {
            $env:CANDIDATE_VERSION = $Matches.version
          }
          if (-not $env:CANDIDATE_VERSION) { throw 'Producer qualification requires an explicit new candidate identity.' }
          ./eng/native/sqlcipher/Test-Windows.ps1 -RunName windows-ci-b
          ./eng/native/sqlcipher/Pack-Windows.ps1 -RunName windows-ci-b -PackageName producer-qualification -CandidateVersion $env:CANDIDATE_VERSION
      - name: Exercise native diagnostic drift refusals
        shell: pwsh
        run: ./eng/native/sqlcipher/Test-WindowsWarningPolicy.ps1 -RunName windows-ci-b
      - name: Verify production assemblies across fresh process reopening
        if: ${{ !(inputs.producer_qualification || startsWith(github.ref, 'refs/heads/shahram/native-producer-')) }}
        shell: pwsh
        run: ./eng/native/sqlcipher/Test-BinaryWindows.ps1 -RunName windows-ci-b
      - name: Measure protected reference and tenfold workloads
        if: ${{ !(inputs.producer_qualification || startsWith(github.ref, 'refs/heads/shahram/native-producer-')) }}
        shell: pwsh
        run: |
          dotnet build eng/benchmarks/Zanance.ProtectedPerformance -c Release -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Protected workload build failed; do not execute stale output.' }
          dotnet run --project eng/benchmarks/Zanance.ProtectedPerformance -c Release --no-build -- artifacts/protected-ci-workloads
          if ($LASTEXITCODE -ne 0) { throw 'Protected workload failed; preserve the original evidence.' }
      # Only producer qualification also exports its unpublished component package; keys/databases stay private.
      - name: Preserve Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-qualification
          path: |
            artifacts/native-sqlcipher/toolchain-review-*/proof.json
            artifacts/native-sqlcipher/warning-policy-*/proof.json
            artifacts/native-sqlcipher/build/windows-ci-*/warning-review-*/proof.json
            artifacts/native-sqlcipher/build/windows-ci-*/build.log
            artifacts/native-sqlcipher/build/windows-ci-*/exports.txt
            artifacts/native-sqlcipher/build/windows-ci-*/dependents.txt
            artifacts/native-sqlcipher/build/windows-ci-*/compiler-host-proof.json
            artifacts/native-sqlcipher/build/windows-ci-*/candidate/manifest.json
            artifacts/native-sqlcipher/build/windows-ci-*/compatibility-proof.json
            artifacts/native-sqlcipher/build/windows-ci-*/compatibility-*/ef-proof.json
            artifacts/native-sqlcipher/build/windows-ci-*/producer-qualification/*.nupkg
            artifacts/native-sqlcipher/build/windows-ci-*/producer-qualification/package-proof.json
            artifacts/native-sqlcipher/build/windows-ci-*/consumer-*/package-proof.json
            artifacts/native-sqlcipher/binary-host/*/restore.log
            artifacts/native-sqlcipher/binary-host/*/build.log
            artifacts/native-sqlcipher/binary-host/*/create.log
            artifacts/native-sqlcipher/binary-host/*/reopen.log
            artifacts/protected-ci-workloads/measurements.json
          if-no-files-found: warn
          retention-days: 14
  linux:
    if: ${{ !(inputs.producer_qualification || startsWith(github.ref, 'refs/heads/shahram/native-producer-')) }}
    name: Official Android slices and stock cipher suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Refuse unreviewed storage capability removals
        run: python3 eng/native/sqlcipher/Linux/test-storage-profile.py
      - name: Check non-root Linux workspace ownership
        shell: pwsh
        run: |
          docker build --tag vafadar-native-sqlcipher-host:review-r30 ./eng/native/sqlcipher/Linux
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed native host restoration failed.' }
          ./eng/native/sqlcipher/Test-ContainerWorkspace.ps1
      - name: Build two clean Android native candidates
        shell: pwsh
        run: |
          ./eng/native/sqlcipher/Build-Android.ps1 -RunName android-ci-a
          ./eng/native/sqlcipher/Build-Android.ps1 -RunName android-ci-b
          foreach ($abi in @('arm64-v8a','x86_64')) {
            $first = Get-FileHash "artifacts/native-sqlcipher/build/android-ci-a/candidate/$abi/libsqlcipher.so"
            $second = Get-FileHash "artifacts/native-sqlcipher/build/android-ci-b/candidate/$abi/libsqlcipher.so"
            if ($first.Hash -ne $second.Hash) { throw "Clean native outputs differ: $abi" }
          }
      - name: Reject malformed native slices
        run: |
          python3 eng/native/sqlcipher/Linux/test-elf.py artifacts/native-sqlcipher/build/android-ci-b/candidate/arm64-v8a/libsqlcipher.so arm64-v8a artifacts/native-sqlcipher > artifacts/native-sqlcipher/elf-arm64.json
          python3 eng/native/sqlcipher/Linux/test-elf.py artifacts/native-sqlcipher/build/android-ci-b/candidate/x86_64/libsqlcipher.so x86_64 artifacts/native-sqlcipher > artifacts/native-sqlcipher/elf-x64.json
      - name: Run official SQLCipher suite with reviewed static crypto
        shell: pwsh
        run: ./eng/native/sqlcipher/Test-UpstreamSqlCipher.ps1 -RunName sqlcipher-ci
      - name: Preserve candidate and security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-native-candidates
          path: |
            artifacts/native-sqlcipher/build/**/candidate/**
            artifacts/native-sqlcipher/build/**/evidence/**
            artifacts/native-sqlcipher/build/**/host-proof.json
            artifacts/native-sqlcipher/build/**/build.log
            artifacts/native-sqlcipher/elf-*.json
          if-no-files-found: warn
          retention-days: 14
