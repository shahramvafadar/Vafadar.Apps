name: Local identity backend

on:
  push:
    branches: [main]
    paths:
      - 'src/Apps/Zanance/Vafadar.Zanance.Api/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Api.Tests/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Core/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Data/**'
      - 'src/Libraries/Vafadar.Data/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Sync.Tests/**'
      - 'eng/sync/**'
      - 'eng/backend/**'
      - 'Directory.Packages.props'
      - '.github/workflows/backend-identity.yml'
  pull_request:
    paths:
      - 'src/Apps/Zanance/Vafadar.Zanance.Api/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Api.Tests/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Core/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Data/**'
      - 'src/Libraries/Vafadar.Data/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Sync.Tests/**'
      - 'eng/sync/**'
      - 'eng/backend/**'
      - 'Directory.Packages.props'
      - '.github/workflows/backend-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ZANANCE_TEST_DB: Host=127.0.0.1;Port=55473;Database=zanance_identity_ci;Username=postgres
      ZANANCE_TEST_CONTAINER: zanance-backend-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare isolated PostgreSQL build dependency
        run: |
          docker run -d --name zanance-backend-ci -p 127.0.0.1:55473:5432 --tmpfs /var/lib/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=zanance_identity_ci postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          # The image bootstrap server accepts Unix sockets before the final TCP server starts.
          for attempt in $(seq 1 30); do
            if docker exec zanance-backend-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_ci; then break; fi
            sleep 1
          done
          docker exec zanance-backend-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_ci
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE zanance_runtime LOGIN'
      - name: Publish security-patched independent test runtime
        run: dotnet publish test/Apps/Zanance/Vafadar.Zanance.Api.Tests/Vafadar.Zanance.Api.Tests.csproj --configuration Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=10.0.13 -p:ContinuousIntegrationBuild=true --output artifacts/identity-test-runtime
      - name: Verify actual identity, private storage and isolated restore
        run: |
          mkdir -p TestResults
          ./artifacts/identity-test-runtime/Vafadar.Zanance.Api.Tests -failSkips -result-xml TestResults/identity.xml
      - name: Upload bounded test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-test-results
          path: TestResults/*.xml
          retention-days: 14
      - name: Remove only the test container
        if: always()
        run: docker rm -f zanance-backend-ci

  personal-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [protocol, planning, operations]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ZANANCE_SYNC_TEST_DB: Host=127.0.0.1;Port=55479;Database=zanance_identity_sync_ci;Username=postgres
      ZANANCE_SYNC_TEST_ROOT: ${{ github.workspace }}/artifacts/sync-fixture-${{ matrix.scenario }}
      ZANANCE_SYNC_TEST_RUNTIME: ${{ github.workspace }}/artifacts/sync-test-runtime
      ZANANCE_SYNC_TEST_PRIVATE: ${{ runner.temp }}/zanance-sync-private-${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare isolated fictional PostgreSQL
        run: |
          docker run -d --name zanance-personal-sync-ci --label pro.vafadar.fixture=personal-sync-ci -p 127.0.0.1:55479:5432 --tmpfs /var/lib/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=zanance_identity_sync_ci postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          for attempt in $(seq 1 30); do
            if docker exec zanance-personal-sync-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_sync_ci; then break; fi
            sleep 1
          done
          docker exec zanance-personal-sync-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_sync_ci
          docker exec zanance-personal-sync-ci psql -U postgres -d zanance_identity_sync_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE zanance_runtime LOGIN'
      - name: Publish patched independent sync qualification runtime
        run: dotnet publish test/Apps/Zanance/Vafadar.Zanance.Sync.Tests/Vafadar.Zanance.Sync.Tests.csproj --configuration Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=10.0.13 -p:ContinuousIntegrationBuild=true --output artifacts/sync-test-runtime
      - name: Qualify actual service and original clients
        run: bash eng/sync/Run-ServiceQualification.sh '${{ matrix.scenario }}'
      - name: Collect only bounded test reports
        if: always()
        run: |
          mkdir -p TestResults
          if [ -d "$ZANANCE_SYNC_TEST_PRIVATE/results" ]; then
            cp "$ZANANCE_SYNC_TEST_PRIVATE/results/"*.xml TestResults/
          fi
      - name: Upload sync qualification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: personal-sync-${{ matrix.scenario }}
          path: TestResults/*.xml
          retention-days: 14
      - name: Remove only this job's fictional database container
        if: always()
        run: docker rm -f zanance-personal-sync-ci
