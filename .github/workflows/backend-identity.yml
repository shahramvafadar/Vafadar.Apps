name: Local identity backend

on:
  push:
    branches: [main]
    paths:
      - 'src/Apps/Zanance/Vafadar.Zanance.Api/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Api.Tests/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Core/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Data/**'
      - 'src/Libraries/Vafadar.Data/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Sync.Tests/**'
      - 'eng/sync/**'
      - 'eng/backend/**'
      - 'Directory.Packages.props'
      - '.github/workflows/backend-identity.yml'
  pull_request:
    paths:
      - 'src/Apps/Zanance/Vafadar.Zanance.Api/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Api.Tests/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Core/**'
      - 'src/Apps/Zanance/Vafadar.Zanance.Data/**'
      - 'src/Libraries/Vafadar.Data/**'
      - 'test/Apps/Zanance/Vafadar.Zanance.Sync.Tests/**'
      - 'eng/sync/**'
      - 'eng/backend/**'
      - 'Directory.Packages.props'
      - '.github/workflows/backend-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ZANANCE_TEST_DB: Host=127.0.0.1;Port=55473;Database=zanance_identity_ci;Username=postgres
      ZANANCE_TEST_CONTAINER: zanance-backend-ci
      ZANANCE_IDENTITY_REMOVAL_TEST_DB: Host=127.0.0.1;Port=55488;Database=zanance_identity_removal_fixture;Username=postgres
      ZANANCE_IDENTITY_REMOVAL_TEST_ROOT: ${{ github.workspace }}/artifacts/identity-removal-ci
      ZANANCE_DELETE_REQUEST_FIXTURE_DB: Host=127.0.0.1;Port=55489;Database=zanance_delete_request_fixture;Username=postgres
      ZANANCE_DELETE_REQUEST_FIXTURE_ROOT: ${{ github.workspace }}/artifacts/deletion-request-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare isolated PostgreSQL build dependency
        run: |
          docker run -d --name zanance-backend-ci -p 127.0.0.1:55473:5432 -p 127.0.0.1:55488:5432 -p 127.0.0.1:55489:5432 --tmpfs /var/lib/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=zanance_identity_ci postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          # The image bootstrap server accepts Unix sockets before the final TCP server starts.
          for attempt in $(seq 1 30); do
            if docker exec zanance-backend-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_ci; then break; fi
            sleep 1
          done
          docker exec zanance-backend-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_ci
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE zanance_runtime LOGIN'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_identity_removal_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_request_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_web_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_inventory_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_objects_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_sync_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_sync_writes_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_identity_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_mail_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_analysis_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_analysis_content_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_analysis_restore_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_household_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_dispatch_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_fence_current_fixture'
          docker exec zanance-backend-ci psql -h 127.0.0.1 -U postgres -d zanance_identity_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE zanance_delete_fence_restored_fixture'
          mkdir -p "$ZANANCE_IDENTITY_REMOVAL_TEST_ROOT" "$ZANANCE_DELETE_REQUEST_FIXTURE_ROOT"
          printf '%s' 'Zanance fictional identity removal fixture' > "$ZANANCE_IDENTITY_REMOVAL_TEST_ROOT/fixture.marker"
          printf '%s' 'Zanance fictional deletion request fixture' > "$ZANANCE_DELETE_REQUEST_FIXTURE_ROOT/fixture.marker"
      - name: Publish security-patched independent test runtime
        run: dotnet publish test/Apps/Zanance/Vafadar.Zanance.Api.Tests/Vafadar.Zanance.Api.Tests.csproj --configuration Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=10.0.15 -p:ContinuousIntegrationBuild=true --output artifacts/identity-test-runtime
      - name: Verify actual identity, private storage and isolated restore
        run: |
          mkdir -p TestResults
          ./artifacts/identity-test-runtime/Vafadar.Zanance.Api.Tests -trait- "Qualification=BillingLocal" -trait- "Qualification=AiLocal" -trait- "Qualification=IdentityMailLocal" -failSkips -result-xml TestResults/identity.xml
      - name: Upload bounded test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-test-results
          path: TestResults/*.xml
          retention-days: 14
      - name: Remove only the test container
        if: always()
        run: docker rm -f zanance-backend-ci

  identity-mail:
    name: Isolated identity mail delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ZANANCE_MAIL_TEST_DB: Host=127.0.0.1;Port=55477;Database=zanance_identity_mail_d1226;Username=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare fresh mail-only fictional databases
        run: |
          docker run -d --name zanance-identity-mail-ci -p 127.0.0.1:55477:5432 --tmpfs /var/lib/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=zanance_identity_mail_d1226 postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          for attempt in $(seq 1 30); do
            if docker exec zanance-identity-mail-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_mail_d1226; then break; fi
            sleep 1
          done
          docker exec zanance-identity-mail-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_mail_d1226
          docker exec zanance-identity-mail-ci createdb -h 127.0.0.1 -U postgres zanance_identity_mail_http_d1226
          docker exec zanance-identity-mail-ci createdb -h 127.0.0.1 -U postgres zanance_identity_mail_d1227
          docker exec zanance-identity-mail-ci createdb -h 127.0.0.1 -U postgres zanance_identity_mail_retry_d1227
      - name: Publish independent mail test runtime
        run: dotnet publish test/Apps/Zanance/Vafadar.Zanance.Api.Tests/Vafadar.Zanance.Api.Tests.csproj --configuration Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=10.0.15 -p:ContinuousIntegrationBuild=true --output artifacts/identity-mail-test-runtime
      - name: Verify original envelope and concurrent worker boundaries
        run: |
          mkdir -p TestResults
          ./artifacts/identity-mail-test-runtime/Vafadar.Zanance.Api.Tests -class '*IdentityMailOutboxTests' -class '*IdentityMailRouteTests' -failSkips -result-xml TestResults/identity-mail-outbox.xml
      - name: Verify complete original localized identity flow
        env:
          ZANANCE_MAIL_TEST_DB: Host=127.0.0.1;Port=55477;Database=zanance_identity_mail_d1227;Username=postgres
        run: ./artifacts/identity-mail-test-runtime/Vafadar.Zanance.Api.Tests -class '*IdentityMailEndToEndTests' -class '*IdentityMailRetryTests' -failSkips -result-xml TestResults/identity-mail-complete.xml
      - name: Upload only bounded fictional test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-mail-test-results
          path: TestResults/identity-mail-*.xml
          retention-days: 14
      - name: Remove only the fresh identity-mail test container
        if: always()
        run: docker rm -f zanance-identity-mail-ci

  billing:
    name: Isolated purchase authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ZANANCE_BILLING_QA_CONNECTION: Host=127.0.0.1;Port=55475;Database=zanance_billing_d295;Username=zanance_billing_qa
      ZANANCE_BILLING_QA_ROOT: ${{ github.workspace }}/artifacts/billing-ci-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare original isolated PostgreSQL dependency
        run: |
          docker run -d --name zanance-billing-ci -p 127.0.0.1:55475:5432 --tmpfs /var/lib/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_USER=zanance_billing_qa -e POSTGRES_DB=zanance_billing_d295 postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          for attempt in $(seq 1 30); do
            if docker exec zanance-billing-ci pg_isready -h 127.0.0.1 -U zanance_billing_qa -d zanance_billing_d295; then break; fi
            sleep 1
          done
          docker exec zanance-billing-ci pg_isready -h 127.0.0.1 -U zanance_billing_qa -d zanance_billing_d295
          mkdir -p "$ZANANCE_BILLING_QA_ROOT" TestResults
          printf '%s' 'Zanance fictional billing d295' > "$ZANANCE_BILLING_QA_ROOT/fixture.marker"
      - name: Publish security-patched purchase test runtime
        run: dotnet publish test/Apps/Zanance/Vafadar.Zanance.Api.Tests/Vafadar.Zanance.Api.Tests.csproj --configuration Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=10.0.15 -p:ContinuousIntegrationBuild=true --output artifacts/billing-test-runtime
      - name: Establish original durable service stages
        run: ./artifacts/billing-test-runtime/Vafadar.Zanance.Api.Tests -class '*BillingPersistenceTests' -failSkips -result-xml TestResults/billing-service.xml
      - name: Continue protected original clients and identity sessions
        run: |
          ./artifacts/billing-test-runtime/Vafadar.Zanance.Api.Tests -class '*BillingClientContinuationTests' -failSkips -result-xml TestResults/billing-clients.xml
          ./artifacts/billing-test-runtime/Vafadar.Zanance.Api.Tests -class '*BillingIdentitySessionTests' -failSkips -result-xml TestResults/billing-sessions.xml
      - name: Upload bounded purchase results only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: billing-authority-results
          path: TestResults/billing-*.xml
          retention-days: 14
      - name: Remove only the ephemeral purchase container
        if: always()
        run: docker rm -f zanance-billing-ci

  personal-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [protocol, planning, operations]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ZANANCE_SYNC_TEST_DB: Host=127.0.0.1;Port=55479;Database=zanance_identity_sync_ci;Username=postgres
      ZANANCE_SYNC_TEST_ROOT: ${{ github.workspace }}/artifacts/sync-fixture-${{ matrix.scenario }}
      ZANANCE_SYNC_TEST_RUNTIME: ${{ github.workspace }}/artifacts/sync-test-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare isolated fictional PostgreSQL
        run: |
          docker run -d --name zanance-personal-sync-ci --label pro.vafadar.fixture=personal-sync-ci -p 127.0.0.1:55479:5432 --tmpfs /var/lib/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=zanance_identity_sync_ci postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          for attempt in $(seq 1 30); do
            if docker exec zanance-personal-sync-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_sync_ci; then break; fi
            sleep 1
          done
          docker exec zanance-personal-sync-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_identity_sync_ci
          docker exec zanance-personal-sync-ci psql -U postgres -d zanance_identity_sync_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE zanance_runtime LOGIN'
      - name: Publish patched independent sync qualification runtime
        run: dotnet publish test/Apps/Zanance/Vafadar.Zanance.Sync.Tests/Vafadar.Zanance.Sync.Tests.csproj --configuration Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=10.0.15 -p:ContinuousIntegrationBuild=true --output artifacts/sync-test-runtime
      - name: Qualify actual service and original clients
        env:
          ZANANCE_SYNC_TEST_PRIVATE: ${{ runner.temp }}/zanance-sync-private-${{ matrix.scenario }}
        run: bash eng/sync/Run-ServiceQualification.sh '${{ matrix.scenario }}'
      - name: Collect only bounded test reports
        if: always()
        env:
          ZANANCE_SYNC_TEST_PRIVATE: ${{ runner.temp }}/zanance-sync-private-${{ matrix.scenario }}
        run: |
          mkdir -p TestResults
          if [ -d "$ZANANCE_SYNC_TEST_PRIVATE/results" ]; then
            cp "$ZANANCE_SYNC_TEST_PRIVATE/results/"*.xml TestResults/
          fi
      - name: Upload sync qualification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: personal-sync-${{ matrix.scenario }}
          path: TestResults/*.xml
          retention-days: 14
      - name: Remove only this job's fictional database container
        if: always()
        run: docker rm -f zanance-personal-sync-ci

  analysis:
    name: Isolated analysis consent and credits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      ZANANCE_AI_QA_CONNECTION: Host=127.0.0.1;Port=55478;Database=zanance_ai_d298;Username=postgres
      ZANANCE_AI_QA_ROOT: ${{ github.workspace }}/artifacts/analysis-ci-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare owned fictional PostgreSQL dependency
        run: |
          docker run -d --name zanance-analysis-ci -p 127.0.0.1:55478:5432 -p 127.0.0.1:55479:5432 --tmpfs /var/lib/postgresql -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=zanance_ai_d298 postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          for attempt in $(seq 1 30); do
            if docker exec zanance-analysis-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_ai_d298; then break; fi
            sleep 1
          done
          docker exec zanance-analysis-ci pg_isready -h 127.0.0.1 -U postgres -d zanance_ai_d298
          mkdir -p "$ZANANCE_AI_QA_ROOT" TestResults
          printf '%s' 'Zanance fictional analysis d298' > "$ZANANCE_AI_QA_ROOT/fixture.marker"
      - name: Publish patched independent analysis test runtime
        run: dotnet publish test/Apps/Zanance/Vafadar.Zanance.Api.Tests/Vafadar.Zanance.Api.Tests.csproj --configuration Release -r linux-x64 --self-contained true -p:RuntimeFrameworkVersion=10.0.15 -p:ContinuousIntegrationBuild=true --output artifacts/analysis-test-runtime
      - name: Verify durable original reservations and outcomes
        run: ./artifacts/analysis-test-runtime/Vafadar.Zanance.Api.Tests -class '*AiCreditPersistenceTests' -failSkips -result-xml TestResults/analysis-store.xml
      - name: Verify pinned HTTPS and private original continuation
        run: ./artifacts/analysis-test-runtime/Vafadar.Zanance.Api.Tests -class '*AiHttpContinuationTests' -failSkips -result-xml TestResults/analysis-http.xml
      - name: Verify separate worker credit ownership and closed default provider
        run: ./artifacts/analysis-test-runtime/Vafadar.Zanance.Api.Tests -class '*AiConcurrentCreditTests' -failSkips -result-xml TestResults/analysis-workers.xml
      - name: Verify optional pilot boundaries with fake providers
        env:
          ZANANCE_AI_PROVIDER_PILOT_CONNECTION: Host=127.0.0.1;Port=55479;Database=zanance_ai_provider_pilot;Username=postgres
          ZANANCE_AI_ADMIN_TEST_CONNECTION: Host=127.0.0.1;Port=55479;Database=zanance_ai_provider_pilot;Username=postgres
          ZANANCE_AI_RECOVERY_TX_CONNECTION: Host=127.0.0.1;Port=55479;Database=zanance_ai_provider_pilot;Username=postgres
          ZANANCE_AI_CREATE_REFUSAL_CONNECTION: Host=127.0.0.1;Port=55479;Database=zanance_ai_provider_pilot;Username=postgres
          ZANANCE_AI_RETENTION_TEST_CONNECTION: Host=127.0.0.1;Port=55479;Database=zanance_ai_provider_pilot;Username=postgres
        run: |
          for method in \
            Switch_retires_quotes_but_pending_requests_keep_their_original_vendor \
            Pilot_cost_budget_reserves_at_acceptance_and_rejects_concurrent_overrun \
            Pilot_recovers_only_never_claimed_create_after_restart \
            Operator_can_view_switch_and_disable_each_purpose_in_the_private_panel \
            Operator_sees_only_bounded_original_pending_metadata \
            Operator_checks_the_original_reference_with_durable_limits \
            OpenAi_notice_recovers_one_matching_claim_and_rejects_foreign_and_duplicate_results \
            Gemini_notice_recovers_only_the_original_input_reference \
            Webhook_rotation_respects_provider_and_explicit_utc_overlap \
            Pilot_records_terminal_usage_without_settling_unusable_output \
            Operator_operations_shows_local_aggregate_without_accessing_providers \
            Pilot_localizes_only_the_fixed_synthetic_corpus_for_both_adapters \
            Notice_binding_rolls_back_with_settlement_and_recovers_an_existing_handle \
            Create_refusal_records_only_bounded_HTTP_status_and_keeps_original_reservation \
            Original_synthetic_vendor_deletion_is_bound_to_the_frozen_route_and_receipt \
            Webhook_capacity_counts_only_notices_that_can_still_be_checked
          do
            docker exec zanance-analysis-ci createdb -h 127.0.0.1 -U postgres zanance_ai_provider_pilot
            export ZANANCE_AI_ADMIN_TEST_ROOT="$ZANANCE_AI_QA_ROOT/$method"
            mkdir -p "$ZANANCE_AI_ADMIN_TEST_ROOT"
            printf '%s' 'Zanance synthetic admin panel' > "$ZANANCE_AI_ADMIN_TEST_ROOT/fixture.marker"
            ./artifacts/analysis-test-runtime/Vafadar.Zanance.Api.Tests -method "*$method" -failSkips -result-xml "TestResults/analysis-$method.xml"
            docker exec zanance-analysis-ci dropdb -h 127.0.0.1 -U postgres zanance_ai_provider_pilot
          done
      - name: Upload bounded analysis reports only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-consent-results
          path: TestResults/analysis-*.xml
          retention-days: 14
      - name: Remove only the ephemeral analysis container
        if: always()
        run: docker rm -f zanance-analysis-ci
