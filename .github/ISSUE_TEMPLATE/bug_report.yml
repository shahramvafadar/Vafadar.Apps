name: Bug report
description: Something in one of the apps does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
        **Never include personal or financial data, passwords or backup files in an issue. Issues are public.**
        Security problems: please report them privately (see SECURITY.md), not here.

  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Finance
        - Other / shared
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Windows
        - Web
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8, Android 16

  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - فارسی (Persian)
        - Deutsch (German)

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Please blur any personal data.
