# Independent local protocol fixture. Never add the outbound connector or owner credentials here.
services:
  api:
    image: zanance-tunnel-qualification:d313
    command: ["server"]
    depends_on: !reset {}
    healthcheck: {disable: true}
  proxy:
    image: zanance-proxy:d313
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.tunnel", "--adapter", "caddyfile"]
    environment:
      ZANANCE_PROXY_AUTHORITY: api.zanance.vafadar.pro
      ZANANCE_CONNECTOR_ADDRESS: ${ZANANCE_CONNECTOR_ADDRESS:?Explicit fixture connector required}
    ports: !reset []
    depends_on: !override
      api: {condition: service_started}
